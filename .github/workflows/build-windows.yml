name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_NAME: WorshipLoopStudio

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.1.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore NuGet packages
        run: dotnet restore WorshipLoopStudio.sln

      - name: Build (Release)
        run: dotnet build WorshipLoopStudio.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Run automated tests
        run: dotnet test tests/WorshipLoopStudio.Tests/WorshipLoopStudio.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish self-contained Windows x64 build
        run: >
          dotnet publish src/WorshipLoopStudio.App/WorshipLoopStudio.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/${{ env.APP_NAME }}

      - name: Generate the starter sample library
        run: dotnet run --project tools/SampleGen/SampleGen.csproj --configuration Release -- publish/${{ env.APP_NAME }}/Samples/Starter

      - name: Add documentation to the package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination publish/${{ env.APP_NAME }}
          Copy-Item docs -Destination publish/${{ env.APP_NAME }}/docs -Recurse

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $zip = "${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/${{ env.APP_NAME }} -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
